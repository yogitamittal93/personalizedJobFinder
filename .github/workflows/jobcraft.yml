name: JobCraft AI Autonomous Pipeline

on:
  schedule:
    # 1. Scraping crawler runs every 8 hours (00:00, 08:00, 16:00 UTC)
    - cron: '0 */8 * * *'
    # 2. Optimized Newsletter summary: runs every 2 days at 04:30 UTC (10:00 AM IST) to prevent email burnout
    - cron: '30 4 */2 * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Which pipeline step to run manually'
        required: true
        default: 'scrape'
        type: choice
        options:
          - scrape
          - newsletter
          - both

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Allows committing database and resumes back to Git

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        python -m playwright install chromium

    - name: Set environment variables
      run: |
        echo "GOOGLE_API_KEY=${{ secrets.GOOGLE_API_KEY }}" >> .env
        echo "EMAIL_APP_PASSWORD=${{ secrets.EMAIL_APP_PASSWORD }}" >> .env
        echo "EMAIL_APP_PASSWORD2=${{ secrets.EMAIL_APP_PASSWORD2 }}" >> .env

    - name: Run Scraping Crawler
      # Runs on: 8-hour cron, or manual with mode=scrape or mode=both
      timeout-minutes: 20
      if: |
        (github.event_name == 'schedule' && github.event.schedule == '0 */8 * * *') ||
        (github.event_name == 'workflow_dispatch' && (inputs.mode == 'scrape' || inputs.mode == 'both'))
      run: |
        python jobcraft.py --cron-check

    # ==========================================
    # CRITICAL: Persist DB immediately after scrape
    # so the newsletter step reads a fresh DB with
    # up-to-date last_emailed values from prior runs.
    # ==========================================
    - name: Persist DB after Scrape
      if: |
        always() && (
          (github.event_name == 'schedule' && github.event.schedule == '0 */8 * * *') ||
          (github.event_name == 'workflow_dispatch' && (inputs.mode == 'scrape' || inputs.mode == 'both'))
        )
      run: |
        git config --global user.name "JobCraft AI Bot"
        git config --global user.email "jobcraft-agent@github.com"
        git add job_tracker.db || true
        git diff --staged --quiet || git commit -m "🤖 Scrape sync: new roles added to tracker [skip ci]"
        git push origin HEAD:${{ github.ref_name }} || true

    - name: Run Newsletter Email
      # Runs on: 2-day cron, or manual with mode=newsletter or mode=both
      if: |
        (github.event_name == 'schedule' && github.event.schedule == '30 4 */2 * *') ||
        (github.event_name == 'workflow_dispatch' && (inputs.mode == 'newsletter' || inputs.mode == 'both'))
      run: |
        python jobcraft.py --cron-summary

    # ==========================================
    # STEP D IMPLEMENTATION: EXPOSE GENERATED ASSETS 
    # ==========================================
    - name: Upload Generated Resumes and Audit Reports
      uses: actions/upload-artifact@v4
      with:
        name: compiled-job-applications-bundle
        path: |
          tailored_resumes/*.docx
          tailored_resumes/*.md
          company_briefs/*.md
        retention-days: 14

    # ==========================================
    # CONSOLIDATED DATA PERSISTENCE LAYER
    # ==========================================
    - name: Commit and Push All Pipeline Changes
      run: |
        git config --global user.name "JobCraft AI Bot"
        git config --global user.email "jobcraft-agent@github.com"
        
        # Stage everything together safely
        git add job_tracker.db candidate_profile.json tailored_resumes/ company_briefs/ || true
        
        # Only commit if there are actual staged changes — prevents silent no-op masking real failures
        git diff --staged --quiet || git commit -m "🤖 Auto-sync: scouted roles, tailored resumes & PDFs, alignment audits [skip ci]"
        git push origin HEAD:${{ github.ref_name }}