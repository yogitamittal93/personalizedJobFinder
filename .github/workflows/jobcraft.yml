name: JobCraft AI Autonomous Pipeline

on:
  schedule:
    # 1. Scraping crawler runs every 8 hours (00:00, 08:00, 16:00 UTC)
    - cron: '0 */8 * * *'
    # 2. Optimized Newsletter summary: runs every 2 days at 04:30 UTC (10:00 AM IST) to prevent email burnout
    - cron: '30 4 */2 * *'
  workflow_dispatch: # Allows manual trigger directly from GitHub UI

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Allows committing database and resumes back to Git

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        python -m playwright install chromium

    - name: Install LaTeX (for PDF compilation)
      run: |
        sudo apt-get update -q
        sudo apt-get install -y texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended texlive-fonts-extra

    - name: Set environment variables
      run: |
        echo "GOOGLE_API_KEY=${{ secrets.GOOGLE_API_KEY }}" >> .env
        echo "EMAIL_APP_PASSWORD=${{ secrets.EMAIL_APP_PASSWORD }}" >> .env
        echo "EMAIL_APP_PASSWORD2=${{ secrets.EMAIL_APP_PASSWORD2 }}" >> .env

    - name: Run Scraping Crawler
      # Run crawler if it's a manual trigger or the 8-hour cron
      if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && github.event.schedule == '0 */8 * * *')
      run: |
        python jobcraft.py --cron-check

    - name: Run Newsletter Email
      # Run newsletter summary if it's a manual trigger or the 2-day cron
      if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && github.event.schedule == '30 4 */2 * *')
      run: |
        python jobcraft.py --cron-summary

    # ==========================================
    # STEP D IMPLEMENTATION: EXPOSE GENERATED ASSETS 
    # ==========================================
    - name: Upload Generated Resumes and Prep Packs to Browser
      uses: actions/upload-artifact@v4
      with:
        name: compiled-job-applications-bundle
        path: |
          tailored_resumes/*.pdf
          tailored_resumes/*.tex
          tailored_resumes/*.md
          company_briefs/*.md
        retention-days: 14

    # ==========================================
    # CONSOLIDATED DATA PERSISTENCE LAYER
    # ==========================================
    - name: Commit and Push All Pipeline Changes
      run: |
        git config --global user.name "JobCraft AI Bot"
        git config --global user.email "jobcraft-agent@github.com"
        
        # Stage everything together safely
        git add job_tracker.db candidate_profile.json tailored_resumes/ company_briefs/ || true
        
        # Commit and push in one single operation to protect branch history integrity
        git commit -m "🤖 Auto-sync: scouted roles, tailored resumes & PDFs, alignment audits [skip ci]" || exit 0
        git push origin HEAD:${{ github.ref_name }}